<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Usage Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2251ff;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
            font-family: Georgia, serif;
            font-weight: bold;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #2251ff;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            text-align: center;
        }

        .stat-box {
            padding: 15px;
            background: #f9f9f9;
            border-radius: 4px;
            border-left: 4px solid #2251ff;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2251ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Credit Usage Tracker</h1>

        <div class="input-group">
            <div class="input-field">
                <label for="totalCredits">Total Credits</label>
                <input type="number" id="totalCredits" value="1000" min="0">
            </div>
            <div class="input-field">
                <label for="remainingCredits">Remaining Credits</label>
                <input type="number" id="remainingCredits" value="650" min="0">
            </div>
        </div>

        <div class="chart-container">
            <canvas id="creditChart"></canvas>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Usage %</div>
                <div class="stat-value" id="percentageUsed">35%</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Used</div>
                <div class="stat-value" id="displayUsed">350</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Remaining</div>
                <div class="stat-value" id="displayRemaining">650</div>
            </div>
        </div>
    </div>

    <script>
        const totalInput = document.getElementById('totalCredits');
        const remainingInput = document.getElementById('remainingCredits');
        const percentageDisplay = document.getElementById('percentageUsed');
        const usedDisplay = document.getElementById('displayUsed');
        const remainingDisplay = document.getElementById('displayRemaining');

        let chart = null;

        function updateChart() {
            const total = parseInt(totalInput.value) || 0;
            const remaining = parseInt(remainingInput.value) || 0;
            const used = Math.max(0, total - remaining);
            const percentage = total > 0 ? Math.round((used / total) * 100) : 0;

            // Update stats
            percentageDisplay.textContent = percentage + '%';
            usedDisplay.textContent = used;
            remainingDisplay.textContent = remaining;

            // Update chart
            if (chart) {
                chart.data.datasets[0].data = [used, remaining];
                chart.options.plugins.tooltip.callbacks.label = function(context) {
                    const value = context.parsed;
                    const percent = total > 0 ? Math.round((value / total) * 100) : 0;
                    return context.label + ': ' + value + ' (' + percent + '%)';
                };
                chart.update();
            }
        }

        function initChart() {
            const ctx = document.getElementById('creditChart').getContext('2d');
            const total = parseInt(totalInput.value) || 0;
            const remaining = parseInt(remainingInput.value) || 0;
            const used = Math.max(0, total - remaining);

            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Used', 'Remaining'],
                    datasets: [{
                        data: [used, remaining],
                        backgroundColor: ['#2251ff', '#E8E8E8'],
                        borderColor: ['#2251ff', '#E8E8E8'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 14, weight: 'bold' },
                                color: '#333',
                                padding: 15,
                                usePointStyle: true
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed;
                                    const percent = total > 0 ? Math.round((value / total) * 100) : 0;
                                    return context.label + ': ' + value + ' (' + percent + '%)';
                                }
                            }
                        }
                    }
                }
            });
        }

        totalInput.addEventListener('input', updateChart);
        remainingInput.addEventListener('input', updateChart);

        initChart();
        updateChart();
    </script>
</body>
</html>
